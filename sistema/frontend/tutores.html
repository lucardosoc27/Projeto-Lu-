<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutores - Clínica Veterinária</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="carregando">
  <header>
    <strong>Clínica Veterinária</strong>
    <nav>
      <a href="inicio.html">Início</a>
      <a href="tutores.html" class="ativo">Tutores</a>
      <a href="pets.html">Pets</a>
      <a href="agendamentos.html">Agendamentos</a>
      <a href="usuarios.html">Usuários</a>
    </nav>
    <span>Olá, <span id="nomeUsuario"></span></span>
    <button id="botaoSair" type="button">Sair</button>
  </header>

  <main>
    <h1>Tutores</h1>

    <div class="caixa">
      <h2 id="tituloForm">Cadastrar tutor</h2>

      <form id="formTutor">
        <input type="hidden" id="id">

        <label>
          Nome *
          <input type="text" id="nome" maxlength="100" required>
        </label>

        <label>
          CPF *
          <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
          <span class="dica" id="dicaCpf" hidden>O CPF salvo não aparece (LGPD). Deixe em branco para manter, ou digite um novo.</span>
        </label>

        <label>
          Telefone *
          <input type="tel" id="telefone" maxlength="20" placeholder="(71) 99999-9999" required>
        </label>

        <label>
          E-mail
          <input type="email" id="email" maxlength="100">
        </label>

        <p id="mensagem" class="mensagem" role="alert"></p>

        <div class="botoes">
          <button type="submit">Salvar</button>
          <button type="button" id="botaoCancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </div>

    <div class="caixa">
      <h2>Tutores cadastrados</h2>
      <p class="dica">O CPF aparece escondido na lista e não volta inteiro nem na edição, para proteger os dados (LGPD).</p>
      <label class="busca">
        Buscar pelo nome
        <input type="search" id="busca" placeholder="Digite o nome do tutor">
      </label>
      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th>E-mail</th>
              <th>Pets</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/endereco.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/tutores.js"></script>
</body>
</html>
